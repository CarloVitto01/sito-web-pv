spring:
  config:
    import: "optional:file:./config/secrets.yml"
  # ==== Profilo attivo di default: locale (PostgreSQL locale, vedi application-local.yml) ====
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  error:
    include-message: never
    include-stacktrace: never

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  clientId: ${PAYPAL_CLIENT_ID:}
  clientSecret: ${PAYPAL_CLIENT_SECRET:}

app:
  # ==== Autenticazione ====
  # In locale va bene un default: in produzione DEVE essere sovrascritto da una variabile d'ambiente (vedi application-prod.yml).
  jwt:
    secret: ${JWT_SECRET:dev-only-local-secret-change-me}
    access-ttl-seconds: 43200
    refresh-ttl-seconds: 2592000
  # ==== CORS ====
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://stampe.photoandvision.it}
  # ==== URL base (usate per link email/telegram) ====
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # ==== Storage file (in produzione puntare al mount del NAS con STORAGE_BASE_DIR) ====
  storage:
    base-dir: ${STORAGE_BASE_DIR:./storage/local}
    temp-dir: ${STORAGE_TEMP_DIR:./storage/tmp-uploads}
  # ==== Email (reset password). In locale, se non abilitata, i messaggi vengono solo loggati ====
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@photoandvision.it}
  # ==== Notifiche Telegram (opzionali: se assenti, la notifica viene solo loggata) ====
  telegram:
    a4:
      token: ${TELEGRAM_A4_TOKEN:}
      chat-id: ${TELEGRAM_A4_CHAT_ID:}
    a3:
      token: ${TELEGRAM_A3_TOKEN:}
      chat-id: ${TELEGRAM_A3_CHAT_ID:}
