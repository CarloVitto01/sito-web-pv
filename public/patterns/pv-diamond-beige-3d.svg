<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <!-- colore base beige -->
    <style>
      .b { stroke:#d6c29a; }
      .s { stroke:#bfa36a; }
    </style>

    <!-- ombra morbida -->
    <filter id="soft3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"></feDropShadow>
    </filter>
  </defs>

  <!-- rombo centrale -->
  <g transform="translate(80 80)" filter="url(#soft3d)" opacity="0.9">

    <!-- lato alto -->
    <path d="M0,-60 L52,0" fill="none" class="b" stroke-width="8" stroke-linecap="round"></path>
    <path d="M0,-60 L-52,0" fill="none" class="b" stroke-width="8" stroke-linecap="round"></path>

    <!-- lato basso -->
    <path d="M-52,0 L0,64" fill="none" class="s" stroke-width="8" stroke-linecap="round"></path>
    <path d="M52,0 L0,64" fill="none" class="s" stroke-width="8" stroke-linecap="round"></path>

    <!-- highlight interno -->
    <path d="M0,-60 L-52,0 L0,6 Z" fill="#fff" fill-opacity="0.08"></path>
    <path d="M0,64 L52,0 L0,-6 Z" fill="#000" fill-opacity="0.06"></path>
  </g>
</svg>
