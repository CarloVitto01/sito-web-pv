server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's default mime.types has no entry for .mjs, so it falls back to
    # application/octet-stream: browsers then refuse to run it as a module
    # (breaks the pdf.js worker, which ships as .mjs). Force the right type.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
